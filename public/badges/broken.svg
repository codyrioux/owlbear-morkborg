  />

  <!-- Fractured Cranium Crack (Broken!) -->
  <path d="M 32 10 L 29 20 L 35 24 L 30 32 L 34 38" stroke="#ff0055" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 30 32 L 25 36" stroke="#ff0055" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 35 24 L 40 21" stroke="#ff0055" stroke-width="1.8" stroke-linecap="round" />

  <!-- Sunken Eye Sockets (Crossed Out / Dead) -->
  <path d="M 23 26 L 29 32 M 29 26 L 23 32" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 35 26 L 41 32 M 41 26 L 35 32" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Triangular Nose Cavity -->
  <polygon points="32,35 30,39 34,39" fill="#0a0a0a" />

  <!-- Jagged Teeth -->
  <rect x="25" y="42" width="3" height="4" fill="#0a0a0a" />
  <rect x="30" y="42" width="4" height="4" fill="#0a0a0a" />
  <rect x="36" y="42" width="3" height="4" fill="#0a0a0a" />

  <!-- Warning Banner Text -->
  <rect x="8" y="48" width="48" height="12" fill="#ff0055" stroke="#0a0a0a" stroke-width="1.5" rx="1" transform="rotate(-3 32 54)" />
  <text x="32" y="57" fill="#fee700" font-family="monospace, sans-serif" font-weight="900" font-size="8.5" text-anchor="middle" letter-spacing="1" transform="rotate(-3 32 54)">BROKEN</text>
</svg>
