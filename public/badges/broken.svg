<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Toxic punk background glow circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0a0a" stroke="#ff0055" stroke-width="3" />
  <circle cx="32" cy="32" r="26" fill="#ff0055" fill-opacity="0.2" />

  <!-- Skull Silhouette -->
  <path d="
    M 20 18
    C 20 10, 44 10, 44 18
    C 44 26, 46 32, 42 38
    L 42 46
    L 22 46
    L 22 38
    C 18 32, 20 26, 20 18
    Z"
    fill="#fee700"
    stroke="#0a0a0a"
