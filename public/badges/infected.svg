<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark border circle -->
  <circle cx="32" cy="32" r="30" fill="#0a0a0a" stroke="#900c14" stroke-width="3" />
  <circle cx="32" cy="32" r="26" fill="#900c14" fill-opacity="0.3" />

  <!-- Droplet Silhouette -->
  <path d="
    M 32 8
    C 32 8, 46 24, 46 36
    C 46 45, 39.5 50, 32 50
    C 24.5 50, 18 45, 18 36
    C 18 24, 32 8, 32 8
    Z"
    fill="#900c14"
    stroke="#fee700"
    stroke-width="2"
  />

  <!-- Toxic Veins / Biohazard spikes -->
  <path d="M 32 18 L 32 38" stroke="#fee700" stroke-width="2" stroke-linecap="round" />
  <path d="M 32 26 L 24 30" stroke="#fee700" stroke-width="2" stroke-linecap="round" />
  <path d="M 32 26 L 40 30" stroke="#fee700" stroke-width="2" stroke-linecap="round" />
  <path d="M 32 34 L 26 40" stroke="#fee700" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 32 34 L 38 40" stroke="#fee700" stroke-width="1.8" stroke-linecap="round" />

  <!-- Toxic Pustule Spots -->
  <circle cx="28" cy="22" r="2" fill="#fee700" />
  <circle cx="36" cy="23" r="1.5" fill="#fee700" />
  <circle cx="25" cy="36" r="2.5" fill="#fee700" />
  <circle cx="39" cy="36" r="2" fill="#fee700" />

  <!-- Warning Banner -->
  <rect x="6" y="48" width="52" height="12" fill="#0a0a0a" stroke="#fee700" stroke-width="1.5" rx="1" transform="rotate(2 32 54)" />
  <text x="32" y="57" fill="#fee700" font-family="monospace, sans-serif" font-weight="900" font-size="7.5" text-anchor="middle" letter-spacing="1" transform="rotate(2 32 54)">INFECTED</text>
</svg>
